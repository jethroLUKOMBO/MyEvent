<script>
/* =========================================================
   MyEvent — application réelle (phase 1), branchée sur Supabase
   ========================================================= */
const SUPABASE_URL = "https://dgbkjdgxxcbiyqogpfpp.supabase.co";
const SUPABASE_KEY = "sb_publishable_mKZS60WA_anxTpqCwr4mIg_My6NUFWj";   // clé publique (protégée par les règles RLS)
const STAFF_DOMAIN = "staff.myevent.app";   // ID du personnel -> e-mail de connexion : ven01@staff.myevent.app

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DAY = 864e5;
const CUR = {USD:"$", CDF:"FC", EUR:"€"};
const STATUS = {reserve:["Réservé","p-info"], vendu:["Vendu","p-ok"], utilise:["Utilisé","p-info"], annule:["Annulé","p-bad"],
  transfere:["Transféré","p-warn"], rembourse:["Remboursé","p-warn"], expire:["Expiré",""]};
const EV_STATUS = {attente:["En attente de validation","p-warn"], valide:["Validé","p-ok"], refuse:["Refusé","p-bad"], suspendu:["Ventes suspendues","p-bad"], archive:["Archivé",""]};
const GRADS = ["linear-gradient(135deg,#8f6a10,#d4af37)","linear-gradient(135deg,#b8891a,#ead48a)","linear-gradient(135deg,#6e520c,#c9a227)","linear-gradient(135deg,#c49a2c,#e9cf7a)"];
const RESULTS = {
  ok:["ok","✅","Entrée autorisée"], deja_utilise:["bad","⚠️","Déjà utilisé"], falsifie:["bad","🚫","Billet falsifié"],
  qr_expire:["bad","📸","QR code expiré"], inconnu:["bad","❓","Billet inconnu"], format_invalide:["bad","⛔","QR non reconnu"],
  non_paye:["bad","⏳","Paiement non effectué"], evenement_archive:["bad","⛔","Événement archivé"]
};

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtD = t => new Date(t).toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"});
const fmtDT = t => new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const money = (n,c) => (Math.round(Number(n||0)*100)/100).toLocaleString("fr-FR")+" "+(CUR[c]||c||"");
const pill = ([l,c]) => `<span class="pill ${c}">${l}</span>`;
const grad = id => GRADS[[...String(id)].reduce((a,c)=>a+c.charCodeAt(0),0)%GRADS.length];
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t.h);t.h=setTimeout(()=>t.classList.remove("on"),2800);}
function toLocalInput(t){const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);}
const iso = v => v ? new Date(v).toISOString() : null;
function waNum(p){ p=(p||"").replace(/\D/g,""); if(p.startsWith("0")) p="243"+p.slice(1); return p; }
function cleanErr(e){ const m=(e&&(e.message||e.error_description||e))+"";
  if(/Invalid login credentials/i.test(m)) return "Identifiant ou mot de passe incorrect";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Pas de connexion Internet. Réessayez.";
  if(/permission denied|Accès refusé/i.test(m)) return "Accès refusé";
  return m; }
// appel serveur : renvoie data ou lève une erreur lisible
async function q(promise){ const {data,error}=await promise; if(error) throw new Error(cleanErr(error)); return data; }
async function rpc(fn,args){ return q(sb.rpc(fn,args||{})); }
async function act(btn,fn){ // exécute une action, gère le bouton et les erreurs
  const b=btn; if(b){b.disabled=true;b.dataset.l=b.textContent;b.textContent="…";}
  try{ await fn(); } catch(e){ toast(cleanErr(e)); } finally{ if(b&&document.body.contains(b)){b.disabled=false;b.textContent=b.dataset.l;} }
}

/* Graphiques légers en SVG/HTML (aucune bibliothèque à télécharger) — une seule série, couleur dorée */
function drawChart(id,type,labels,data,o={}){
  const el=document.getElementById(id); if(!el) return;
  const fmt=v=>o.unit?money(v,o.unit):v+" billet"+(v>1?"s":"");
  if(type==="bar"){ // barres horizontales avec valeur affichée
    const max=Math.max(1,...data); el.parentNode.style.height="auto";
    el.innerHTML=labels.map((l,i)=>`<div class="hb" title="${esc(l)} : ${esc(fmt(data[i]))}"><div class="hb-l"><span>${esc(l)}</span><b>${esc(fmt(data[i]))}</b></div><div class="hb-t"><i style="width:${data[i]?Math.max(2,data[i]/max*100):0}%"></i></div></div>`).join("")||'<p class="small muted">Aucune donnée.</p>';
    return;
  }
  // courbe avec zone, grille et info-bulle au toucher
  const W=el.clientWidth||320,H=el.clientHeight||200,L=30,Rr=8,T=10,B=24,iw=W-L-Rr,ih=H-T-B;
  const raw=Math.max(1,...data), step=Math.pow(10,Math.floor(Math.log10(raw))), max=Math.ceil(raw/step*1.1)*step||1;
  const X=i=>L+(data.length>1?i/(data.length-1)*iw:iw/2), Y=v=>T+ih-v/max*ih;
  const pts=data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const grid=[0,.5,1].map(f=>{const v=Math.round(max*f),y=Y(v);return `<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="${f?"#efe7d2":"#ddd2b5"}"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#756b55">${v}</text>`;}).join("");
  const every=Math.ceil(labels.length/5), xl=labels.map((l,i)=>(labels.length-1-i)%every?"":`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#756b55">${l}</text>`).join("");
  el.style.position="relative";
  el.innerHTML=`<svg width="${W}" height="${H}" style="display:block;touch-action:pan-y">${grid}${xl}
    <polygon points="${X(0)},${Y(0)} ${pts.join(" ")} ${X(data.length-1)},${Y(0)}" fill="rgba(212,175,55,.16)"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="#b8891a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="xh" y1="${T}" y2="${T+ih}" stroke="#b8891a" stroke-dasharray="3 3" opacity="0"/><circle class="xd" r="5" fill="#b8891a" stroke="#fff" stroke-width="2" opacity="0"/>
    <rect x="${L}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg=el.querySelector("svg"),xh=el.querySelector(".xh"),xd=el.querySelector(".xd"),tip=el.querySelector(".tip");
  const move=ev=>{const r=svg.getBoundingClientRect(),x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;const i=Math.max(0,Math.min(data.length-1,Math.round((x-L)/iw*(data.length-1))));
    xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.setAttribute("opacity",1);xd.setAttribute("cx",X(i));xd.setAttribute("cy",Y(data[i]));xd.setAttribute("opacity",1);
    tip.innerHTML=`<span>${labels[i]}</span><b>${fmt(data[i])}</b>`;tip.style.opacity=1;tip.style.left=Math.min(W-110,Math.max(0,X(i)-55))+"px";};
  const out=()=>{xh.setAttribute("opacity",0);xd.setAttribute("opacity",0);tip.style.opacity=0;};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);svg.addEventListener("pointerleave",out);
}


function dailySeries(rows,days=14){
  const labels=[],data=[],start=new Date();start.setHours(0,0,0,0);
  for(let d=days-1;d>=0;d--){const a=start.getTime()-d*DAY;labels.push(new Date(a).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}));
    data.push(rows.filter(r=>{const t=new Date(r.day||r.created_at).getTime();return t>=a&&t<a+DAY;}).reduce((s,r)=>s+(r.count!=null?Number(r.count):1),0));}
  return {labels,data};
}

const TABS={
  admin:[["a-dash","📊","Tableau"],["a-events","🎫","Événements"],["a-sellers","🧑‍💼","Vendeurs"],["a-tickets","🎟️","Billets"],["a-staff","🔑","Personnel"],["a-audit","📜","Journal"]],

async function loadMe(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ ME=null; return; }
  const {data,error}=await sb.from("staff").select("*").eq("id",session.user.id).maybeSingle();
  if(error||!data||!data.active){ ME=null; await sb.auth.signOut(); if(data&&!data.active) toast("Cet ID est désactivé"); else if(!error) toast("Ce compte n'a pas d'accès au personnel"); return; }
  if(data.expires_at&&new Date(data.expires_at)<new Date()){ ME=null; await sb.auth.signOut(); toast("Cet ID temporaire a expiré"); return; }
  ME=data;

function render(){

async function uploadPoster(blob){
  const path=`${new Date().toISOString().slice(0,10)}/${crypto.randomUUID()}.jpg`;

}

function addSellerRow(){ const d=document.createElement("div");d.className="typerow selrow";d.innerHTML=`<input class="f sn" placeholder="Nom du vendeur"><input class="f sp" inputmode="tel" placeholder="Téléphone"><button class="btn sec sm" onclick="this.parentNode.remove()">✕</button>`;$("#sellers").appendChild(d); }

    const date=new Date(g("et")).getTime(),open=new Date(g("eo")).getTime(),close=new Date(g("ecl")).getTime(),cap=parseInt(g("ec"),10);

      :!g("en")?"Nom de l'événement requis":!window._poster?"Ajoutez l'affiche de l'événement":!g("el")?"Lieu requis":!(cap>0)?"Capacité invalide":!types.length?"Ajoutez au moins un type de billet avec un prix"
      :!(open<close&&close<=date)?"Vérifiez les dates (ouverture < clôture ≤ événement)":sellers.some(x=>x.name.length<2||!/^\+?\d{9,13}$/.test(x.phone))?"Chaque vendeur proposé doit avoir un nom et un numéro valide":null;
    if(err) throw new Error(err);
    const poster_url=await uploadPoster(window._poster);
    await rpc("propose_event",{p:{name:g("en"),poster_url,description:g("ed")||null,starts_at:iso(g("et")),place:g("el"),capacity:cap,currency:g("ecur"),
      open_at:iso(g("eo")),close_at:iso(g("ecl")),conditions:g("ecd")||null,contact_name:g("cn"),contact_phone:g("cp").replace(/\s/g,""),contact_email:g("cm"),types,sellers}});
    if(ME){ toast("Événement soumis à l'Administrateur supérieur"); return go("o-events"); }

      <button class="btn full" onclick="mode='home';render()">Retour à l'accueil</button>`; window.scrollTo(0,0);
  });
}

   <div class="card center"><h3>Code d'entrée</h3><div class="code6" style="font-size:30px;margin:8px 0">${esc(r.code6)}</div>
    <p class="small muted">${k==="none"?"Écrivez ce code sur le carton de l'acheteur. À l'entrée, l'agent vérifiera la photo et la pièce d'identité.":"L'acheteur présentera ce code à l'entrée."}</p></div>
   ${k==="smart"?`<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${waNum(phone)}?text=${encodeURIComponent(msg)}">📲 Envoyer le billet sur WhatsApp</a>`
   :k==="basic"?`<a class="wa" style="background:var(--card2);color:var(--text)" href="sms:${esc(phone)}?body=${encodeURIComponent(`MyEvent: ${r.event} ${fmtD(r.starts_at)}. ${r.holder}. Code d'entree: ${r.code6}`)}">✉️ Envoyer le code par SMS</a>`:""}
   <button class="btn sec full" style="margin-top:10px" onclick="render()">Nouvelle vente</button>`;
}
VIEWS["v-sales"]=async()=>{
  const L=await q(sb.from("tickets").select("id,number,holder_name,phone,price,currency,status,created_at,event_id").eq("seller_id",ME.id).order("created_at",{ascending:false}));
  $("#view").innerHTML=`<h1>Mes ventes</h1><p class="lead">${L.length} billet(s) vendu(s)</p>${searchBox("vs","Rechercher un acheteur",L.length)}
   <div class="card">${L.map(t=>`<div class="row" data-v data-s="${esc((t.holder_name+" "+(t.phone||"")+" "+t.number).toLowerCase())}"><div class="t"><b>${esc(t.holder_name)}</b><small>${t.number} · ${money(t.price,t.currency)} · ${fmtDT(t.created_at)}</small></div>${pill(STATUS[t.status]||[t.status,""])}</div>`).join("")||'<p class="muted">Aucune vente.</p>'}</div>`;
  bindFilter("vs","[data-v]");
};

/* =========================================================
   AGENT DE CONTRÔLE
   ========================================================= */
function showResult(r,extra=""){
  const [k,ic,title]=RESULTS[r.result]||["bad","⛔","Billet refusé"];
  let msg=r.holder?`${esc(r.holder)} · ${esc(r.type||"")}<br>${esc(r.event||"")}`:"";
  if(r.result==="deja_utilise"&&r.used_at) msg=`Entré à ${new Date(r.used_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}${r.used_by?" (agent "+esc(r.used_by)+")":""}. Refuser l'entrée.`;
  if(r.result==="qr_expire") msg="Probablement une capture d'écran. Demandez d'ouvrir le billet en direct.";
  if(r.result==="falsifie") msg="La signature ne correspond pas. Refuser l'entrée.";
  if(String(r.result).startsWith("invalide_")) msg="Ce billet n'est plus valable ("+esc(r.result.slice(9))+").";
  $("#res").innerHTML=`<div class="res ${k}"><div class="ic">${ic}</div><h2>${title}</h2><p>${msg}</p>${extra}</div>`; window.scrollTo({top:0,behavior:"smooth"});
}
VIEWS["g-check"]=()=>{
  $("#view").innerHTML=`<h1>Contrôle à l'entrée</h1><p class="lead">Scannez le QR code ou tapez le code à 6 caractères.</p><div id="res"></div>
   <div class="card"><label class="upload">📷 Scanner (photo du QR code)<input type="file" accept="image/*" capture="environment" id="qf"></label>
    <label>Ou code à 6 caractères</label><div style="display:flex;gap:8px"><input class="f" id="cc" autocapitalize="characters" placeholder="Ex : K7MP2X"><button class="btn" id="cbtn" onclick="checkCode(this)">Vérifier</button></div></div>`;
  $("#cc").addEventListener("keydown",e=>{if(e.key==="Enter")checkCode($("#cbtn"));});
  $("#qf").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const img=new Image(); img.onload=()=>{ const c=document.createElement("canvas"),k=Math.min(1,1200/Math.max(img.width,img.height)); c.width=img.width*k;c.height=img.height*k; const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);
    let r=null; try{r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);}catch(err){} URL.revokeObjectURL(img.src); e.target.value="";
    if(!(r&&r.data)) return toast("Aucun QR code lisible"); act(null,async()=>showResult(await rpc("agent_scan_qr",{p_payload:r.data}))); }; img.src=URL.createObjectURL(f); };
};
function checkCode(btn){
  const code=$("#cc").value.trim().toUpperCase().replace(/\s/g,"");
  if(code.startsWith("ME1|")) return act(btn,async()=>showResult(await rpc("agent_scan_qr",{p_payload:code})));
  if(!/^[A-Z0-9]{6}$/.test(code)) return toast("Saisissez un code à 6 caractères");
  act(btn,async()=>{ const L=await rpc("agent_lookup",{p_query:code}); const t=(L||[]).find(x=>x.number!==undefined); if(!t) return showResult({result:"inconnu"}); identity(t); });
}
function identity(t){
  if(t.status==="utilise") return showResult({result:"deja_utilise",used_at:t.used_at});
  const box=t.id_doc_type?`<div class="idbox">${t.photo_url?`<img class="ph" src="${esc(t.photo_url)}">`:""}<div class="small"><b style="font-size:15px">${esc(t.holder)}</b><br>${esc(t.id_doc_type)}<br>finissant par <b>${esc(t.id_doc_last4)}</b><br><span class="muted">Comparez avec la personne et sa pièce.</span></div></div>`
    :`<p class="small" style="margin-top:8px">Demandez le nom et vérifiez les derniers chiffres du téléphone : <b>…${esc(t.phone_end||"")}</b></p>`;
  $("#res").innerHTML=`<div class="res warn"><div class="ic">🪪</div><h2>Vérification d'identité</h2><p>${esc(t.holder)} · ${esc(t.type)} · ${esc(t.event)}</p>${box}
   <div class="btns" style="justify-content:center"><button class="btn" onclick="admit(this,'${t.id}')">Autoriser l'entrée</button><button class="btn sec" onclick="$('#res').innerHTML=''">Refuser</button></div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function admit(btn,id){ act(btn,async()=>showResult(await rpc("agent_admit",{p_ticket:id}))); }
VIEWS["g-search"]=()=>{
  $("#view").innerHTML=`<h1>Recherche manuelle</h1><p class="lead">Pour les participants sans smartphone : nom, n° de billet, téléphone ou code.</p>
   <div id="res"></div><div style="display:flex;gap:8px;margin-bottom:10px"><input class="f" id="gq" placeholder="Rechercher…"><button class="btn" id="gbtn" onclick="gsearch(this)">Chercher</button></div><div id="gl"></div>`;
  $("#gq").addEventListener("keydown",e=>{if(e.key==="Enter")gsearch($("#gbtn"));});
};
function gsearch(btn){
  const v=$("#gq").value.trim(); if(v.length<2) return toast("Au moins 2 caractères");
  act(btn,async()=>{ const L=await rpc("agent_lookup",{p_query:v}); window._GL=L||[];
    $("#gl").innerHTML=`<div class="card">${window._GL.map((t,i)=>`<div class="row"><div class="t"><b>${esc(t.holder)}</b><small>${t.number} · ${esc(t.event)} · ${esc(t.type)}${t.id_doc_type?" · 🪪 pièce":""}</small></div>${t.status==="vendu"?`<button class="btn sm" onclick="identity(window._GL[${i}])">Vérifier</button>`:pill(STATUS[t.status]||[t.status,""])}</div>`).join("")||'<p class="muted">Aucun résultat.</p>'}</div>`; });
}

/* ---------- démarrage ---------- */
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ ME=null; } });
(async()=>{ try{ await loadMe(); }catch(e){} render(); })();
</script>
