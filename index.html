<style>

:root{--bg:#faf8f3;--card:#ffffff;--card2:#f6f0e1;--line:#ece3cb;--text:#1f1a10;--muted:#756b55;
--acc:#d4af37;--gold:#b8891a;--goldtx:#8f6a10;--acc2:#e9cf7a;--warn:#b36b00;--bad:#c93644;--ok:#13804f;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:80px;font-size:15px}
h1,h2,h3,.brand{font-family:Sora,sans-serif;letter-spacing:-.3px}
button{font:inherit;cursor:pointer;border:none;color:inherit}
input,select,textarea{font:inherit}
.wrap{max-width:620px;margin:0 auto;padding:0 14px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;gap:10px}
.brand{font-size:22px;font-weight:800}.brand span{color:var(--gold)}
.who{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.who b{color:var(--text);display:block;font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.p-ok{background:rgba(19,128,79,.1);color:var(--ok);border-color:transparent}
.p-warn{background:rgba(212,175,55,.18);color:var(--warn);border-color:transparent}
.p-bad{background:rgba(201,54,68,.1);color:var(--bad);border-color:transparent}
.p-info{background:rgba(184,137,26,.12);color:var(--goldtx);border-color:transparent}
h1{font-size:24px;margin:10px 0 4px}
.lead{color:var(--muted);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(80,60,10,.05)}
.card h3{font-size:16px;margin-bottom:8px}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{background:linear-gradient(135deg,#e2c25a,#d4af37);color:#241c06;font-weight:700;padding:10px 16px;border-radius:12px;font-size:14px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.full{width:100%;padding:13px;font-size:15px}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;font-weight:500}
.f{width:100%;background:#fff;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:11px;font-size:15px}
textarea.f{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
input[type=datetime-local].f{font-size:13px;padding:11px 8px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:Sora;font-size:21px;margin-top:2px}
.stat small{color:var(--muted);font-size:11px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;max-width:620px;margin:0 auto;overflow-x:auto}
.tabs button{flex:1;min-width:56px;background:none;color:var(--muted);padding:9px 2px;font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button .i{font-size:19px;line-height:1}
.tabs button.on{color:var(--goldtx);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .t{min-width:0}.row .t b{display:block;font-size:14px}.row .t small{color:var(--muted);font-size:12px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.ev-img{height:130px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:12px}
.ev-img h3{font-size:20px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.ev-img .pill{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.5);color:#fff;border:none}
.ev-b{padding:12px 14px}
.bar{height:7px;background:var(--card2);border-radius:9px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--acc))}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:36px}
.search:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.filters{display:flex;gap:8px;margin-bottom:10px}.filters select{flex:1;font-size:13px;padding:9px}
.modal-bg{position:fixed;inset:0;background:rgba(30,24,10,.45);z-index:30;display:none;align-items:flex-end;justify-content:center}
.modal-bg.on{display:flex}
.modal{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:20px;margin-bottom:6px}
.x{float:right;background:var(--card2);width:32px;height:32px;border-radius:10px;font-size:16px}
.mail{background:var(--card2);color:#1f1a10;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;font-size:13px}
.mail b.code{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:4px;display:block;margin-top:6px}
.ticket{background:#fff;color:#1f1a10;border:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,10,.08);border-radius:var(--r);overflow:hidden;margin-bottom:14px;position:relative}
.ticket .th{padding:14px;color:#fff;background-size:cover;background-position:center}
.ticket .th h3{font-size:18px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.ticket .th p{font-size:12px;opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ticket .tb{display:flex;gap:12px;padding:14px;align-items:center}
.qr{width:150px;height:150px;flex-shrink:0;position:relative}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.ticket .info{font-size:13px;line-height:1.55}
.ticket .info b{font-size:15px}
.code6{font-family:ui-monospace,monospace;font-size:20px;font-weight:700;letter-spacing:3px;color:var(--goldtx)}
.tick{height:4px;background:#e6e9f2;margin:0 14px 12px;border-radius:4px;overflow:hidden}
.tick i{display:block;height:100%;background:var(--acc);transition:width 1s linear}
.stamp{position:absolute;top:70px;right:14px;transform:rotate(-12deg);border:3px solid var(--bad);color:var(--bad);font-weight:800;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.9);font-family:Sora}
.res{border-radius:var(--r);padding:20px 14px;text-align:center;margin-bottom:12px}
.res.ok{background:rgba(19,128,79,.07);border:2px solid var(--ok)}
.res.bad{background:rgba(201,54,68,.07);border:2px solid var(--bad)}
.res.warn{background:rgba(212,175,55,.1);border:2px solid var(--acc)}
.res .ic{font-size:42px}.res h2{margin:6px 0 4px;font-size:21px}.res p{color:var(--muted);font-size:14px}
.ph{width:84px;height:84px;border-radius:14px;object-fit:cover;background:var(--card2)}
.idbox{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card2);border-radius:14px;padding:10px;margin-top:12px}
.login-hero{text-align:center}
.login-hero .brand{font-size:40px}
.demo{font-size:12px;color:var(--muted);line-height:1.8}
.demo code{background:var(--card2);padding:2px 6px;border-radius:6px;color:var(--text);font-size:12px}
.notif{background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.5);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.notif.bad{background:rgba(201,54,68,.06);border-color:rgba(201,54,68,.35)}
.typerow{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin-bottom:8px}
.ops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.op{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 4px;font-size:12px;font-weight:600}
.op.on{border-color:var(--acc)}
.op i{display:block;width:22px;height:22px;border-radius:7px;margin:0 auto 5px}
.spin{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.upload{display:block;text-align:center;background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:13px;font-size:14px;cursor:pointer}
.upload input{display:none}
.center{text-align:center}
a.wa{display:block;text-align:center;background:#25d366;color:#05300f;font-weight:700;padding:13px;border-radius:12px;text-decoration:none;margin-top:10px}
.log{font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.log b{color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px}
.chk input{width:18px;height:18px;accent-color:var(--gold)}
.chart{position:relative;height:200px}
.chart>div{width:100%;height:100%}
.tip{position:absolute;top:-6px;width:110px;background:#1f1a10;color:#fff;border-radius:8px;padding:6px 8px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .15s;text-align:center}
.tip span{display:block;opacity:.75}
.hb{margin-bottom:10px}.hb-l{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}.hb-l span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:12px;background:var(--card2);border-radius:4px;overflow:hidden}.hb-t i{display:block;height:100%;background:#c9a227;border-radius:0 4px 4px 0}
.chart.tall{height:240px}
.login-hero{background:linear-gradient(160deg,#fffdf6,#f6ecd0);border:1px solid var(--line);border-radius:20px;margin-top:14px;padding:28px 10px}
.back{background:none;color:var(--goldtx);font-weight:600;font-size:14px;padding:6px 0}

.err{background:rgba(201,54,68,.07);border:1px solid rgba(201,54,68,.35);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.loading{text-align:center;color:var(--muted);padding:40px 0}
.tag-soon{font-size:12px;color:var(--goldtx);background:var(--card2);border-radius:8px;padding:8px 10px;margin-top:8px}
.brand{display:flex;align-items:center;gap:4px}
.ticket{background:#fff;color:#1f1a10;border-radius:var(--r);overflow:hidden;margin-bottom:14px;position:relative;border:1px solid var(--line);box-shadow:0 2px 10px rgba(80,60,10,.08)}
.ticket .th{padding:16px 14px;color:#fff}.ticket .th h3{font-size:20px;text-shadow:0 1px 8px rgba(0,0,0,.5)}.ticket .th p{font-size:13px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ticket .tb{display:flex;gap:12px;padding:16px;align-items:center}
.ticket .info{font-size:14px;line-height:1.6;margin-top:8px}
.qr img,.qr canvas{width:100%!important;height:100%!important}
.tick{height:5px;background:#e6e9f2;border-radius:4px;overflow:hidden}.tick i{display:block;height:100%;background:var(--acc);transition:width 1s linear}
.stamp{position:absolute;top:80px;right:14px;transform:rotate(-12deg);border:3px solid var(--bad);color:var(--bad);font-weight:800;padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.9);font-family:Sora;z-index:2}
.ev-poster{display:block;width:100%;height:auto;max-height:640px;object-fit:contain;background:#f6f0e1}
.ev-title{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px 0}
.ev-title h3{font-size:19px}
.ev.focus{box-shadow:0 0 0 3px var(--acc)}
.greet{font-family:Sora,sans-serif;font-weight:600;font-size:15px;color:var(--goldtx);margin:2px 0 4px}
.slogan{margin-top:8px;font-family:Sora,sans-serif;font-weight:600;font-size:17px;color:var(--goldtx);letter-spacing:.3px}
.slogan span{display:inline-block;opacity:0;transform:translateY(10px);animation:wordIn .7s cubic-bezier(.2,.7,.2,1) forwards}
.logo-glow{display:inline-block;animation:logoIn .8s cubic-bezier(.2,.7,.2,1) both,logoGlow 2.8s ease-in-out 1.4s infinite}
@keyframes wordIn{to{opacity:1;transform:none}}
@keyframes logoIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes logoGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(212,175,55,0))}50%{filter:drop-shadow(0 0 12px rgba(212,175,55,.9)) brightness(1.12)}}
@media (prefers-reduced-motion:reduce){.slogan span,.logo-glow{animation:none!important;opacity:1;transform:none}}
.brand .bt{color:var(--text)}
.brand .bt span{color:var(--gold)}
.hdr{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.hdr .brand{flex:1;font-size:21px}
.burger{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#e2c25a,#d4af37);color:#241c06;font:700 13px Sora,sans-serif;display:flex;align-items:center;justify-content:center;flex:none}
.av.big{width:64px;height:64px;font-size:22px;margin:0 auto 8px}
.lnk{background:var(--card);border:1px solid var(--acc);color:var(--goldtx);font-weight:600;font-size:13px;padding:9px 12px;border-radius:12px;white-space:nowrap}
.drawer-bg{position:fixed;inset:0;background:rgba(30,24,10,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer-bg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--card);z-index:41;transform:translateX(-102%);transition:transform .25s ease;overflow-y:auto;padding:16px 12px calc(20px + env(safe-area-inset-bottom))}
.drawer.on{transform:none}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:4px 8px 12px}
.drawer .mi{display:flex;align-items:center;gap:12px;width:100%;background:none;text-align:left;padding:11px 8px;border-radius:12px;font-size:15px}
.drawer .mi:active,.drawer .mi.on{background:var(--card2)}
.drawer .mi .i{width:24px;text-align:center;font-size:18px;flex:none}
.drawer .mi small{display:block;color:var(--muted);font-size:12px}
.drawer .sep{height:1px;background:var(--line);margin:8px 4px}
.drawer .ttl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:8px 8px 2px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;padding:9px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--goldtx);box-shadow:0 1px 3px rgba(80,60,10,.12)}
.mtk{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(80,60,10,.05)}
.mtk .mh{display:flex;gap:12px;padding:12px;align-items:center}
.mtk .thumb{width:62px;height:78px;border-radius:10px;flex:none;background:#f6f0e1 center/cover;display:flex;align-items:center;justify-content:center}
.mtk h3{font-size:16px;margin-bottom:2px}
.mtk .acts{display:flex;border-top:1px dashed #e2c25a}
.mtk .acts button{flex:1;background:none;padding:11px 4px;font-size:12px;font-weight:600;color:var(--goldtx)}
.mtk .acts button+button{border-left:1px solid var(--line)}
.jx{display:inline-block;font:700 12px Sora,sans-serif;color:#241c06;background:linear-gradient(135deg,#e2c25a,#d4af37);padding:3px 8px;border-radius:8px}
.empty{text-align:center;padding:30px 10px}
.empty .ic{margin-bottom:10px}
.gt{background:linear-gradient(180deg,#fffdf6,#fbf3dc);border:1.5px solid #e2c25a;border-radius:20px;overflow:hidden;position:relative;box-shadow:0 8px 28px rgba(184,137,26,.2);margin-bottom:14px}
.gt .gimg{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#f6f0e1}
.gt .gband{background:linear-gradient(135deg,#8f6a10,#d4af37);padding:26px 16px;text-align:center}
.gt .gname{padding:14px 16px 0}
.gt .gname h3{font-size:21px}
.gt .gname p{font-size:13px;color:var(--muted);margin-top:3px}
.perf{position:relative;height:26px;margin:12px 0 6px}
.perf:before,.perf:after{content:"";position:absolute;top:0;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1.5px solid #e2c25a}
.perf:before{left:-14px}.perf:after{right:-14px}
.perf i{position:absolute;left:20px;right:20px;top:12px;border-top:2px dashed #e2c25a}
.gq{display:flex;flex-direction:column;align-items:center;padding:0 16px 18px;text-align:center;position:relative}
.qrbox{background:#fff;padding:10px;border-radius:14px;border:1px solid var(--line)}
.qlive{display:flex;align-items:center;gap:6px;font:600 12px Inter,sans-serif;color:var(--goldtx);margin-bottom:8px}
.gstamp{position:absolute;top:70px;left:50%;transform:translateX(-50%) rotate(-14deg);border:4px solid var(--bad);color:var(--bad);font:800 26px Sora,sans-serif;padding:4px 16px;border-radius:10px;background:rgba(255,255,255,.88);letter-spacing:2px;animation:stampIn .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stampIn{from{opacity:0;transform:translateX(-50%) rotate(-14deg) scale(2)}}
.cd{display:flex;justify-content:center;gap:8px;margin:2px 0 12px}
.cd div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:58px}
.cd b{display:block;font:700 18px Sora,sans-serif;color:var(--goldtx)}
.cd small{font-size:11px;color:var(--muted)}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.choice.main{border:1.5px solid var(--acc);background:linear-gradient(180deg,#fffdf6,#fbf3dc)}
.choice h3{font-size:17px;margin-bottom:4px}
.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step .n{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#e2c25a,#d4af37);color:#241c06;font:700 15px Sora,sans-serif;display:flex;align-items:center;justify-content:center;flex:none}
details.faq{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
details.faq summary{font-weight:600;cursor:pointer}
details.faq p{margin-top:8px;font-size:14px;color:var(--muted);line-height:1.5}

function cleanErr(e){ const m=(e&&(e.message||e.error_description||e))+"";
  if(/Invalid login credentials/i.test(m)) return "Identifiant ou mot de passe incorrect";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Pas de connexion Internet. Réessayez.";
  if(/permission denied|Accès refusé/i.test(m)) return "Accès refusé";
  if(/Failed to send a request to the Edge Function|Requested function was not found/i.test(m)) return "La fonction serveur « create-staff » est introuvable : vérifiez qu'elle est bien déployée dans Supabase.";
  return m; }
// appel serveur : renvoie data ou lève une erreur lisible
/* ---- Cache : affiche tout de suite les données déjà téléchargées, puis les actualise en arrière-plan ---- */
const READ_RPC=new Set(["event_stats","seller_dashboard"]);
let CACHE={}, USE_CACHE=false, PENDING=[], NEXT_FRESH=false;
const cacheScope=()=>"me_cache_"+(ME?ME.id:"public");
function cacheLoad(){ try{ CACHE=JSON.parse(localStorage.getItem(cacheScope())||"{}"); }catch(e){ CACHE={}; } }
function cacheSave(){ try{ const j=JSON.stringify(CACHE); if(j.length<1500000) localStorage.setItem(cacheScope(),j); }catch(e){} }
function cacheClear(){ try{ Object.keys(localStorage).filter(k=>k.startsWith("me_cache_")&&k!=="me_cache_public").forEach(k=>localStorage.removeItem(k)); }catch(e){} CACHE={}; }
function ckey(b){ try{ return b&&b.method==="GET"&&b.url?String(b.url):null; }catch(e){ return null; } }
async function fetchKey(k,thunk){ const {data,error}=await thunk(); if(error) throw new Error(cleanErr(error)); CACHE[k]=data; cacheSave(); return data; }
async function q(promise){
  const k=ckey(promise);
  if(k&&USE_CACHE&&k in CACHE){ PENDING.push({k,thunk:()=>promise}); return CACHE[k]; }
  if(!k){ const {data,error}=await promise; if(error) throw new Error(cleanErr(error)); return data; }
  return fetchKey(k,()=>promise);
}
async function rpc(fn,args){
  args=args||{};
  if(READ_RPC.has(fn)){ const k="rpc:"+fn+":"+JSON.stringify(args);
    if(USE_CACHE&&k in CACHE){ PENDING.push({k,thunk:()=>sb.rpc(fn,args)}); return CACHE[k]; }
    return fetchKey(k,()=>sb.rpc(fn,args)); }
  const r=await q(sb.rpc(fn,args)); NEXT_FRESH=true; return r;   // après une modification : données fraîches
}
/* Exécute une vue : d'abord avec le cache (instantané), puis vérifie en arrière-plan et redessine si quelque chose a changé */
async function swr(paint,stillHere){
  const fresh=NEXT_FRESH; NEXT_FRESH=false;
  USE_CACHE=!fresh; PENDING=[];
  try{ await paint(); } finally{ USE_CACHE=false; }
  const todo=PENDING; PENDING=[]; if(!todo.length) return;
  let changed=false;
  for(const {k,thunk} of todo){ try{ const before=JSON.stringify(CACHE[k]); const {data,error}=await thunk(); if(error) continue; if(JSON.stringify(data)!==before){ CACHE[k]=data; changed=true; } }catch(e){} }
  if(changed){ cacheSave(); const typing=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if(stillHere()&&!$("#mbg").classList.contains("on")&&!typing){ USE_CACHE=true; try{ await paint(); } finally{ USE_CACHE=false; PENDING=[]; } } }
}
async function callFn(name,body){ // appel d'une fonction serveur (Edge Function)
  const {data,error}=await sb.functions.invoke(name,{body});
  if(error){ let m=error.message; try{ const j=await error.context.json(); if(j&&j.error) m=j.error; }catch(e){} throw new Error(cleanErr(m)); }
  if(data&&data.error) throw new Error(data.error); NEXT_FRESH=true; return data;
}
async function act(btn,fn){ // exécute une action, gère le bouton et les erreurs
  const b=btn; if(b){b.disabled=true;b.dataset.l=b.textContent;b.textContent="…";}
  try{ await fn(); } catch(e){ toast(cleanErr(e)); } finally{ if(b&&document.body.contains(b)){b.disabled=false;b.textContent=b.dataset.l;} }
}

/* Graphiques légers en SVG/HTML (aucune bibliothèque à télécharger) — une seule série, couleur dorée */
function drawChart(id,type,labels,data,o={}){
  const el=document.getElementById(id); if(!el) return;
  const fmt=v=>o.unit?money(v,o.unit):v+" billet"+(v>1?"s":"");
  if(type==="bar"){ // barres horizontales avec valeur affichée
    const max=Math.max(1,...data); el.parentNode.style.height="auto";
    el.innerHTML=labels.map((l,i)=>`<div class="hb" title="${esc(l)} : ${esc(fmt(data[i]))}"><div class="hb-l"><span>${esc(l)}</span><b>${esc(fmt(data[i]))}</b></div><div class="hb-t"><i style="width:${data[i]?Math.max(2,data[i]/max*100):0}%"></i></div></div>`).join("")||'<p class="small muted">Aucune donnée.</p>';
    return;
  }
  // courbe avec zone, grille et info-bulle au toucher
  const W=el.clientWidth||320,H=el.clientHeight||200,L=30,Rr=8,T=10,B=24,iw=W-L-Rr,ih=H-T-B;
  const raw=Math.max(1,...data), step=Math.pow(10,Math.floor(Math.log10(raw))), max=Math.ceil(raw/step*1.1)*step||1;
  const X=i=>L+(data.length>1?i/(data.length-1)*iw:iw/2), Y=v=>T+ih-v/max*ih;
  const pts=data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
  const grid=[0,.5,1].map(f=>{const v=Math.round(max*f),y=Y(v);return `<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="${f?"#efe7d2":"#ddd2b5"}"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#756b55">${v}</text>`;}).join("");
  const every=Math.ceil(labels.length/5), xl=labels.map((l,i)=>(labels.length-1-i)%every?"":`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#756b55">${l}</text>`).join("");
  el.style.position="relative";
  el.innerHTML=`<svg width="${W}" height="${H}" style="display:block;touch-action:pan-y">${grid}${xl}
    <polygon points="${X(0)},${Y(0)} ${pts.join(" ")} ${X(data.length-1)},${Y(0)}" fill="rgba(212,175,55,.16)"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="#b8891a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="xh" y1="${T}" y2="${T+ih}" stroke="#b8891a" stroke-dasharray="3 3" opacity="0"/><circle class="xd" r="5" fill="#b8891a" stroke="#fff" stroke-width="2" opacity="0"/>
    <rect x="${L}" y="0" width="${iw}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg=el.querySelector("svg"),xh=el.querySelector(".xh"),xd=el.querySelector(".xd"),tip=el.querySelector(".tip");
  const move=ev=>{const r=svg.getBoundingClientRect(),x=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;const i=Math.max(0,Math.min(data.length-1,Math.round((x-L)/iw*(data.length-1))));
    xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.setAttribute("opacity",1);xd.setAttribute("cx",X(i));xd.setAttribute("cy",Y(data[i]));xd.setAttribute("opacity",1);
    tip.innerHTML=`<span>${labels[i]}</span><b>${fmt(data[i])}</b>`;tip.style.opacity=1;tip.style.left=Math.min(W-110,Math.max(0,X(i)-55))+"px";};
  const out=()=>{xh.setAttribute("opacity",0);xd.setAttribute("opacity",0);tip.style.opacity=0;};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);svg.addEventListener("pointerleave",out);
}


function dailySeries(rows,days=14){
  const labels=[],data=[],start=new Date();start.setHours(0,0,0,0);
  for(let d=days-1;d>=0;d--){const a=start.getTime()-d*DAY;labels.push(new Date(a).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}));
    data.push(rows.filter(r=>{const t=new Date(r.day||r.created_at).getTime();return t>=a&&t<a+DAY;}).reduce((s,r)=>s+(r.count!=null?Number(r.count):1),0));}
  return {labels,data};
}

function dlIcs(){ const t=window._ICS, s=icsDate(t.starts_at), e=icsDate(new Date(t.starts_at).getTime()+4*36e5);

function buySend(btn){

    const ph=$("#bph").value.replace(/[^\d+]/g,""); if(!BUY.op) throw new Error("Choisissez votre opérateur"); if(ph.replace(/\D/g,"").length<9) throw new Error("Numéro Mobile Money invalide");

   <button class="btn sec full" style="margin-top:14px" onclick="buyCancel()">Annuler la commande</button></div>`);
  const exp=new Date(BUY.order.expires_at).getTime(); let busy=false, tick=0;
  buyTimer=setInterval(async()=>{
    const left=Math.max(0,exp-Date.now()), el=$("#bhold"); if(!el){ clearInterval(buyTimer); return; }
    el.textContent=`${Math.floor(left/60000)}:${String(Math.floor(left%60000/1000)).padStart(2,"0")}`;

    }catch(e){} busy=false;
  },1000);

function toggleFav(id,btn){ let F=favs(); const on=!F.includes(id); F=on?[...F,id]:F.filter(x=>x!==id); lsSet("me_favs",F); syncPrefs();
  if(btn){ btn.textContent=on?"♥":"♡"; btn.classList.toggle("on",on); btn.setAttribute("aria-label",on?"Retirer des favoris":"Ajouter aux favoris"); }
  toast(on?"Ajouté à vos favoris":"Retiré de vos favoris"); if(mode==="favs") renderFavs(); }

  document.querySelectorAll(`[data-fo="${org}"]`).forEach(b=>{ b.textContent=on?"✓ Abonné":"＋ Suivre"; b.classList.toggle("on",on); });
  toast(on?`Vous suivez ${name} : vous serez prévenu de ses prochains événements`:`Vous ne suivez plus ${name}`); if(mode==="favs") renderFavs(); }

   Avant l'ouverture : l'agent télécharge la liste des billets de l'événement.
   Sans réseau : le QR est vérifié sur le téléphone, les entrées sont notées,

const OFFK=()=>"meoff_pack_"+(ME?ME.id:""), OFFQ=()=>"meoff_q_"+(ME?ME.id:""), OFFC=()=>"meoff_conf_"+(ME?ME.id:"");
const offPack=()=>lsGet(OFFK(),null), offQueue=()=>lsGet(OFFQ(),[]);
const netErr=e=>!navigator.onLine||/fetch|network|load failed|timeout|connexion internet/i.test(String(e&&e.message||e));
async function sha256hex(s){ const b=new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s))); return [...b].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function offCard(){

async function downloadPack(id){

function offTicket(pred){ const P=offPack(); if(!P) return null; if(new Date(P.event.starts_at).getTime()+2*DAY<Date.now()){ try{ localStorage.removeItem(OFFK()); }catch(e){} return null; }
  return P.tickets.find(pred)||null; }
function offState(t){ const q=offQueue().find(x=>x.number===t.number); return q?{status:"utilise",used_at:q.at,used_by:"vous, hors connexion"}:{status:t.status,used_at:t.used_at,used_by:t.used_by}; }
function offRecord(t,how){ const Q=offQueue(); if(Q.some(x=>x.number===t.number)) return false; Q.push({ticket_id:t.id,number:t.number,at:new Date().toISOString(),how}); lsSet(OFFQ(),Q); paintOff(); return true; }
async function offScan(payload){
  if(!offPack()) return showResult({result:"pas_de_reseau"});
  const p=String(payload).split("|"); if(p.length!==4||p[0]!=="ME1") return showResult({result:"format_invalide"});
  const t=offTicket(x=>x.number===p[1]); if(!t) return showResult({result:"inconnu"});
  if(await hmac12(t.qr_key,t.number+"|"+p[2])!==p[3]) return showResult({result:"falsifie"});
  if(Math.abs(Math.floor(Date.now()/1000/WIN)-Number(p[2]))>1) return showResult({result:"qr_expire"});
  const s=offState(t), info={holder:t.holder,type:t.type,event:offPack().event.name};
  if(s.status==="utilise") return showResult({result:"deja_utilise",...s});
  if(s.status!=="vendu") return showResult({result:"invalide_"+s.status});
  offRecord(t,"qr"); showResult({result:"ok",...info},`<p class="small" style="margin-top:6px">📶 Entrée notée hors connexion, envoyée au retour du réseau.</p>`);
}
function offLookup(qy){ const P=offPack(); if(!P) return null; const v=qy.toLowerCase().replace(/\s/g,"");

    .map(t=>({...t,...offState(t),event:P.event.name,offline:true})); }
async function syncOff(btn,manual){

/* 3 essais de connexion maximum par identifiant, puis blocage 15 minutes sur cet appareil */
const LOCK_MIN=15;
function lockInfo(id){ try{ return JSON.parse(localStorage.getItem("me_lock_"+id)||'{"n":0,"until":0}'); }catch(e){ return {n:0,until:0}; } }
function lockSet(id,v){ try{ localStorage.setItem("me_lock_"+id,JSON.stringify(v)); }catch(e){} }
function login(btn){
  act(btn,async()=>{
    let id=$("#lid").value.trim(), pw=$("#lpw").value;
    if(!id||!pw) throw new Error("Saisissez votre ID et votre mot de passe");
    const key=id.toLowerCase(), L=lockInfo(key);
    if(L.until>Date.now()) throw new Error(`Trop de tentatives. Réessayez dans ${Math.ceil((L.until-Date.now())/60000)} minute(s).`);
    const email=id.includes("@")?key:`${key}@${STAFF_DOMAIN}`;
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error){
      const m=cleanErr(error);
      if(m!=="Identifiant ou mot de passe incorrect") throw new Error(m);
      const n=(L.until&&L.until<=Date.now()?0:L.n)+1;
      if(n>=3){ lockSet(key,{n:0,until:Date.now()+LOCK_MIN*60000}); throw new Error(`3 tentatives incorrectes : connexion bloquée ${LOCK_MIN} minutes.`); }
      lockSet(key,{n,until:0}); throw new Error(`Identifiant ou mot de passe incorrect. Il vous reste ${3-n} essai(s).`);
    }
    lockSet(key,{n:0,until:0});
    await loadMe(); tab=null; cacheLoad(); if(ME&&ME.role==="agent") lsSet("meoff_pw_"+ME.id,await sha256hex(ME.id+"|"+pw)); if(ME){ NEXT_FRESH=true; render(); resetIdle(); }
  });
}

  if(r.result==="deja_utilise"&&r.used_at) msg=`Entré à ${new Date(r.used_at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}${r.used_by?" (agent "+esc(r.used_by)+")":""}. Refuser l'entrée.`;
  if(r.result==="qr_expire") msg="Probablement une capture d'écran. Demandez d'ouvrir le billet en direct.";
  if(r.result==="pas_de_reseau") msg="Le mode hors connexion n'a pas été préparé sur ce téléphone. Utilisez la recherche par nom et la pièce d'identité, ou retrouvez du réseau.";
  if(r.result==="falsifie") msg="La signature ne correspond pas. Refuser l'entrée.";
  if(String(r.result).startsWith("invalide_")) msg="Ce billet n'est plus valable ("+esc(r.result.slice(9))+").";
  $("#res").innerHTML=`<div class="res ${k}"><div class="ic">${ic}</div><h2>${title}</h2><p>${msg}</p>${extra}</div>`; window.scrollTo({top:0,behavior:"smooth"});
}
async function scanQR(payload){
  if(navigator.onLine){ try{ return showResult(await rpc("agent_scan_qr",{p_payload:payload})); }catch(e){ if(!netErr(e)) throw e; } }
  return offScan(payload);
}
async function lookupAny(qy){
  if(navigator.onLine){ try{ return await rpc("agent_lookup",{p_query:qy}); }catch(e){ if(!netErr(e)) throw e; } }
  const L=offLookup(qy); if(L===null) throw new Error("Pas de réseau et mode hors connexion non préparé"); return L;
}
VIEWS["g-check"]=()=>{
  $("#view").innerHTML=`<h1>Contrôle à l'entrée</h1><p class="lead">Scannez le QR code ou tapez le code à 6 caractères.</p>${offCard()}<div id="res"></div>
   <div class="card"><label class="upload">📷 Scanner (photo du QR code)<input type="file" accept="image/*" capture="environment" id="qf"></label>
    <label>Ou code à 6 caractères</label><div style="display:flex;gap:8px"><input class="f" id="cc" autocapitalize="characters" placeholder="Ex : K7MP2X"><button class="btn" id="cbtn" onclick="checkCode(this)">Vérifier</button></div></div>`;
  $("#cc").addEventListener("keydown",e=>{if(e.key==="Enter")checkCode($("#cbtn"));});
  $("#qf").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const img=new Image(); img.onload=()=>{ const c=document.createElement("canvas"),k=Math.min(1,1200/Math.max(img.width,img.height)); c.width=img.width*k;c.height=img.height*k; const x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);
    let r=null; try{r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);}catch(err){} URL.revokeObjectURL(img.src); e.target.value="";
    if(!(r&&r.data)) return toast("Aucun QR code lisible"); act(null,async()=>scanQR(r.data)); }; img.src=URL.createObjectURL(f); };
};
function checkCode(btn){
  const raw=$("#cc").value.trim();
  if(raw.startsWith("ME1|")) return act(btn,async()=>scanQR(raw));
  const code=raw.toUpperCase().replace(/\s/g,"");
  if(!/^[A-Z0-9]{6}$/.test(code)) return toast("Saisissez un code à 6 caractères");
  act(btn,async()=>{ const L=await lookupAny(code); const t=(L||[]).find(x=>x.number!==undefined); if(!t) return showResult({result:"inconnu"}); identity(t); });
}
function identity(t){
  if(t.status==="utilise") return showResult({result:"deja_utilise",used_at:t.used_at,used_by:t.used_by});
  window._IDT=t;
  const box=t.id_doc_type?`<div class="idbox">${t.photo_url?`<img class="ph" src="${esc(t.photo_url)}">`:""}<div class="small"><b style="font-size:15px">${esc(t.holder)}</b><br>${esc(t.id_doc_type)}<br>finissant par <b>${esc(t.id_doc_last4)}</b><br><span class="muted">Comparez avec la personne et sa pièce.</span></div></div>`
    :`<p class="small" style="margin-top:8px">Demandez le nom et vérifiez les derniers chiffres du téléphone : <b>…${esc(t.phone_end||"")}</b></p>`;
  $("#res").innerHTML=`<div class="res warn"><div class="ic">🪪</div><h2>Vérification d'identité</h2><p>${esc(t.holder)} · ${esc(t.type)} · ${esc(t.event)}</p>${box}
   <div class="btns" style="justify-content:center"><button class="btn" onclick="admit(this,'${t.id}')">Autoriser l'entrée</button>${t.offline?`<p class="small muted" style="width:100%;margin-top:6px">📶 Hors connexion</p>`:""}<button class="btn sec" onclick="$('#res').innerHTML=''">Refuser</button></div></div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}
function admit(btn,id){ act(btn,async()=>{
  const t=window._IDT&&window._IDT.id===id?window._IDT:null;
  if(navigator.onLine&&!(t&&t.offline)){ try{ return showResult(await rpc("agent_admit",{p_ticket:id})); }catch(e){ if(!netErr(e)) throw e; } }
  const o=offTicket(x=>x.id===id); if(!o) throw new Error("Billet absent de la liste hors connexion");
  const s=offState(o); if(s.status==="utilise") return showResult({result:"deja_utilise",...s});
  offRecord(o,"identite"); showResult({result:"ok",holder:o.holder,type:o.type,event:offPack().event.name},`<p class="small" style="margin-top:6px">📶 Entrée notée hors connexion.</p>`); }); }

  $("#view").innerHTML=`<h1>Recherche manuelle</h1><p class="lead">Pour les participants sans smartphone : nom, n° de billet, téléphone ou code.</p>${offCard()}
   <div id="res"></div><div style="display:flex;gap:8px;margin-bottom:10px"><input class="f" id="gq" placeholder="Rechercher…"><button class="btn" id="gbtn" onclick="gsearch(this)">Chercher</button></div><div id="gl"></div>`;

function gsearch(btn){
  const v=$("#gq").value.trim(); if(v.length<2) return toast("Au moins 2 caractères");
  act(btn,async()=>{ const L=await lookupAny(v); window._GL=L||[];
    $("#gl").innerHTML=`<div class="card">${window._GL.map((t,i)=>`<div class="row"><div class="t"><b>${esc(t.holder)}</b><small>${t.number} · ${esc(t.event)} · ${esc(t.type)}${t.id_doc_type?" · 🪪 pièce":""}</small></div>${t.status==="vendu"?`<button class="btn sm" onclick="identity(window._GL[${i}])">Vérifier</button>`:pill(STATUS[t.status]||[t.status,""])}</div>`).join("")||'<p class="muted">Aucun résultat.</p>'}</div>`; });
}

/* =========================================================
   BILLET DE L'ACHETEUR : QR dynamique lié au téléphone, visible hors connexion
   ========================================================= */
const WIN=30;
function deviceId(){ try{ let d=localStorage.getItem("me_device"); if(!d){ const a=crypto.getRandomValues(new Uint8Array(24)); d=[...a].map(x=>x.toString(16).padStart(2,"0")).join(""); localStorage.setItem("me_device",d); } return d; }catch(e){ return null; } }
async function hmac12(key,msg){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(key),{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const s=new Uint8Array(await crypto.subtle.sign("HMAC",k,new TextEncoder().encode(msg)));
  let b=""; s.slice(0,12).forEach(x=>b+=String.fromCharCode(x)); return btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
let tkTimer=null;
async function renderTicket(){
  clearInterval(tkTimer);
  const {number,token}=window._TK||{}, store="me_ticket_"+number;
  shell(`<div id="tkv"><div class="loading">Ouverture de votre billet…</div></div>`);
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(store)||"null"); }catch(e){}
  if(cached&&cached.token===token) paintTicket(cached.data,true);
  const dev=deviceId();
  if(!dev){ $("#tkv").innerHTML=`<div class="err">Votre navigateur bloque l'enregistrement du billet. Ouvrez le lien dans Chrome.</div>`; return; }
  try{
    const r=await rpc("ticket_open",{p_number:number,p_token:token,p_device:dev});
    if(r.error){
      if(cached&&cached.token===token&&r.error!=="autre_appareil") return;
      const m={lien:"Ce lien de billet n'est pas valide. Vérifiez qu'il a été copié en entier.",autre_appareil:"Ce billet est déjà ouvert sur un autre téléphone. Pour la sécurité, il ne peut être utilisé que sur un seul téléphone. Si vous avez changé de téléphone, contactez l'organisateur.",appareil:"Votre navigateur n'est pas compatible. Ouvrez le lien dans Chrome."}[r.error]||r.error;
      try{ localStorage.removeItem(store); }catch(e){}
      clearInterval(tkTimer); $("#tkv").innerHTML=`<div class="res bad" style="margin-top:20px"><div class="ic">🔒</div><h2>Billet indisponible ici</h2><p>${esc(m)}</p></div>`; return;
    }
    try{ localStorage.setItem(store,JSON.stringify({token,data:r})); }catch(e){}
    paintTicket(r,false);
  }catch(e){ if(!cached) $("#tkv").innerHTML=`<div class="err">${esc(cleanErr(e))}</div><button class="btn sec" onclick="renderTicket()">Réessayer</button>`; }
}
function paintTicket(t,offline){
  clearInterval(tkTimer);
  const st=t.status==="vendu"&&evPast(t)?"expire":t.status, live=st==="vendu";
  window._CT={...t,link_token:(window._TK||{}).token};
  $("#tkv").innerHTML=`<h1>Mon billet</h1><p class="lead">${t.event_status==="annule"?"Ce billet a été annulé avec l'événement.":live?"Présentez ce QR code à l'entrée. Il change toutes les 30 secondes : une capture d'écran ne fonctionne pas.":st==="utilise"?"Merci d'être venu ! Ce billet a été utilisé.":"Ce billet n'est plus utilisable."}</p>
   ${offline?`<p class="small muted" style="margin:-8px 0 10px">📶 Affiché sans connexion</p>`:""}
   ${eventNotice(t)}
   ${live?`<div class="cd" id="tkcd"></div>`:""}
   <div class="gt">
    ${t.poster_url?`<img class="gimg" src="${esc(t.poster_url)}" alt="Affiche">`:`<div class="gband">${LOGO(56,"#fff")}</div>`}
    <div class="gname"><h3>${esc(t.event)}</h3><p>📅 ${fmtDT(t.starts_at)}<br>📍 ${esc(t.place)}</p></div>
    <div class="perf"><i></i></div>
    <div class="gq">
     ${live?`<div class="qlive"><span class="logo-glow">${LOGO(22)}</span>QR actif</div>`:""}
     <div class="qrbox"><div class="qr" id="tkqr" style="width:220px;height:220px">${live?"":`<div style="width:100%;height:100%;background:#f3eee0;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#a99a72"></div>`}</div></div>
     ${live?`<div class="tick" style="width:220px;margin:8px 0 0"><i id="tkbar"></i></div>`:""}
     ${live?"":`<div class="gstamp">${(STATUS[st]||[st])[0].toUpperCase()}</div>`}
     <div class="info"><b style="font-size:18px">${esc(t.holder)}</b><br>${esc(t.type)} · Billet n° ${esc(t.number)}<br><span class="small" style="color:#756b55">Code de secours : <b>${esc(t.code6)}</b></span></div>
    </div></div>
   ${live?`<div class="btns"><button class="btn sec" style="flex:1" onclick="mapsTo(window._CT)">🗺️ Itinéraire</button><button class="btn sec" style="flex:1" onclick="agendaBox(window._CT)">📅 Agenda</button></div>
   <button class="btn sec full" style="margin-top:8px" onclick="transferBox(window._CT)">🎁 Transférer à un ami</button>
   ${t.postponed_from&&!t.refund?`<button class="btn sec full" style="margin-top:8px" onclick="refundRequest()">💸 Je ne peux pas venir : demander un remboursement</button>`:""}
   <p class="small muted center" style="margin-top:10px">💡 À l'entrée, montez la luminosité de votre écran pour un scan plus rapide.</p>`:""}
   <p class="small muted center" style="margin-top:8px">MyEvent — La clé de vos événements</p>`;
  if(!live) return;
  keepAwake();
  const cdPaint=()=>{ const c=document.getElementById("tkcd"); if(!c) return; let ms=new Date(t.starts_at)-Date.now();
    if(ms<=0){ c.innerHTML=`<div style="min-width:auto;padding:8px 14px"><b>C'est aujourd'hui ! 🎉</b></div>`; return; }
    const d=Math.floor(ms/DAY), h=Math.floor(ms%DAY/36e5), m=Math.floor(ms%36e5/6e4);
    c.innerHTML=`<div><b>${d}</b><small>jour${d>1?"s":""}</small></div><div><b>${h}</b><small>heure${h>1?"s":""}</small></div><div><b>${m}</b><small>min</small></div>`; };
  const draw=async()=>{
    const el=document.getElementById("tkqr"); if(!el){ clearInterval(tkTimer); return; }
    const w=Math.floor(Date.now()/1000/WIN);
    if(el.dataset.w!==String(w)){ el.dataset.w=w; cdPaint(); const payload=`ME1|${t.number}|${w}|${await hmac12(t.qr_key,t.number+"|"+w)}`; el.innerHTML="";
      try{ new QRCode(el,{text:payload,width:440,height:440,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.textContent="QR indisponible"; } }
    const b=document.getElementById("tkbar"); if(b) b.style.width=((WIN-(Math.floor(Date.now()/1000)%WIN))/WIN*100)+"%";
  };
  draw(); tkTimer=setInterval(draw,1000);
}
let wakeLock=null;
async function keepAwake(){ try{ if("wakeLock" in navigator&&!wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>{wakeLock=null;}); } }catch(e){} }

/* ---------- inactivité : 5 minutes sans utilisation -> retour à l'accueil (et déconnexion du personnel) ---------- */
const IDLE_MS=5*60000; let lastActive=Date.now(), idleTimer=null;
function resetIdle(){ lastActive=Date.now(); clearTimeout(idleTimer); idleTimer=setTimeout(onIdle,IDLE_MS); }
function onIdle(){
  if(Date.now()-lastActive<IDLE_MS-1000) return resetIdle();
  if(ME&&ME.role==="agent"&&lsGet("meoff_pw_"+ME.id,"")) return agentLock();
  if(ME) return logout("Session fermée après 5 minutes d'inactivité. Reconnectez-vous.");
  if(!["home","ticket","mytickets","profile"].includes(mode)){ mode="home"; closeModal(); closeDrawer(); render(); }
}
["pointerdown","keydown","touchstart","scroll"].forEach(ev=>window.addEventListener(ev,()=>{ if(Date.now()-lastActive>1000) resetIdle(); else lastActive=Date.now(); },{passive:true}));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(Date.now()-lastActive>=IDLE_MS) onIdle(); else resetIdle(); } });

window.addEventListener("hashchange",()=>{ const mt=location.hash.match(/^#t-([A-Z0-9]{8})-([A-Z0-9]{16})$/); if(mt){ mode="ticket"; window._TK={number:mt[1],token:mt[2]}; render(); } });
/* ---------- application installable ---------- */
let installEvt=null;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function installHTML(){
  if(isStandalone()) return "";
  if(installEvt) return `<button class="btn full" style="margin-top:10px;background:#1f1a10;color:#f3e3a8" onclick="installApp()">📲 Installer l'application MyEvent</button>`;
  if(isIOS()) return `<div class="tag-soon" style="margin-top:10px">📲 <b>Installer sur iPhone :</b> appuyez sur <b>Partager</b> (le carré avec la flèche ⬆️), puis sur <b>« Sur l'écran d'accueil »</b>.</div>`;
  return `<div class="tag-soon" style="margin-top:10px">📲 <b>Installer l'application :</b> dans Chrome, menu <b>⋮</b> puis <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b>.</div>`;
}
function refreshInstall(){ const b=$("#installBox"); if(b) b.innerHTML=installHTML(); }
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; refreshInstall(); });
window.addEventListener("appinstalled",()=>{ installEvt=null; refreshInstall(); toast("MyEvent est installée sur votre téléphone 🎉"); });
async function installApp(){ if(!installEvt) return; installEvt.prompt(); try{ await installEvt.userChoice; }catch(e){} installEvt=null; refreshInstall(); }
if("serviceWorker" in navigator&&(location.protocol==="https:"||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ---------- démarrage ---------- */
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_OUT"){ ME=null; } });
(async()=>{
  const h=location.hash; if(h.startsWith("#e-")){ mode="home"; window._focusEv=h.slice(3); }
  const mt=h.match(/^#t-([A-Z0-9]{8})-([A-Z0-9]{16})$/); if(mt){ mode="ticket"; window._TK={number:mt[1],token:mt[2]}; }
  try{ await loadMe(); }catch(e){}
  cacheLoad(); render(); resetIdle();
})();
