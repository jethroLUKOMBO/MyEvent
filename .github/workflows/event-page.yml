name: Pages des événements (aperçus WhatsApp)

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: event-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils et polices MyEvent (Sora, Inter)
        run: |
          pip install --quiet pillow
          mkdir -p /tmp/fonts
          curl -sfL -o /tmp/fonts/Sora.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/sora/Sora%5Bwght%5D.ttf" || rm -f /tmp/fonts/Sora.ttf
          curl -sfL -o /tmp/fonts/Inter.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz,wght%5D.ttf" || rm -f /tmp/fonts/Inter.ttf
          ls -la /tmp/fonts
      - name: Générer les images et les pages
        env:
          FONTS: /tmp/fonts
          OUT: e
        run: |
          cat > /tmp/build.py <<'PY'
          import json, os, re, html, io, urllib.request, datetime
          from PIL import Image, ImageDraw, ImageFont, ImageFilter, ImageOps
          SITE = "https://jethrolukombo.github.io/MyEvent/"
          SUPA = os.environ.get("SUPA", "https://dgbkjdgxxcbiyqogpfpp.supabase.co")
          KEY  = os.environ.get("KEY",  "sb_publishable_mKZS60WA_anxTpqCwr4mIg_My6NUFWj")
          OUT  = os.environ.get("OUT", "e")
          FONTS = os.environ.get("FONTS", ".fonts")
          def get(url, hdr=None):
              req = urllib.request.Request(url, headers=hdr or {"User-Agent": "MyEvent-pages"})
              with urllib.request.urlopen(req, timeout=30) as r: return r.read()
          def F(fam, wght, size):
              """Polices de MyEvent : Sora (titres, logo) et Inter (texte), comme dans l'application."""
              p = {"sora": f"{FONTS}/Sora.ttf", "inter": f"{FONTS}/Inter.ttf"}[fam]
              try:
                  f = ImageFont.truetype(p, size)
                  try:
                      axes = f.get_variation_axes(); vals = []
                      for a in axes:
                          nm = a.get("name"); nm = nm.decode() if isinstance(nm, bytes) else str(nm)
                          vals.append(wght if "eight" in nm.lower() or "wght" in nm.lower() else max(a["minimum"], min(a["maximum"], 14 if "ptical" in nm or "opsz" in nm else a["default"])))
                      f.set_variation_by_axes(vals)
                  except Exception: pass
                  return f
              except Exception:
                  return ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if wght >= 600 else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", size)
          HAS_SORA = os.path.exists(f"{FONTS}/Sora.ttf")
          MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"]
          JOURS = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"]
          def fdate(iso):
              d = datetime.datetime.fromisoformat(iso.replace("Z", "+00:00")).astimezone(datetime.timezone(datetime.timedelta(hours=1)))
              return f"{JOURS[d.weekday()].capitalize()} {d.day} {MOIS[d.month-1]} {d.year}", f"{d.hour:02d}h{d.minute:02d}"
          G = "#b8891a"
          def logo(d, ox, oy, sc, col=G):
              P = lambda x, y: (ox + x*sc, oy + y*sc)
              d.polygon([P(*p) for p in [(42,36),(38,10),(51,22),(60,4),(69,22),(82,10),(78,36)]], fill=col)
              d.rounded_rectangle([P(42,38), P(78,44)], radius=2*sc, fill=col)
              for a, b, w in [((60,46),(60,94),8), ((60,80),(74,80),7), ((60,92),(70,92),7)]:
                  d.line([P(*a), P(*b)], fill=col, width=int(w*sc))
                  for p in (a, b):
                      cx, cy = P(*p); r = w*sc/2; d.ellipse((cx-r, cy-r, cx+r, cy+r), fill=col)
          def wrap(d, text, f, maxw, maxl):
              words, lines, cur = text.split(), [], ""
              for w in words:
                  t = (cur + " " + w).strip()
                  if d.textlength(t, font=f) <= maxw: cur = t
                  else:
                      if cur: lines.append(cur)
                      cur = w
              if cur: lines.append(cur)
              if len(lines) > maxl:
                  lines = lines[:maxl]
                  while d.textlength(lines[-1] + "…", font=f) > maxw and " " in lines[-1]: lines[-1] = lines[-1].rsplit(" ", 1)[0]
                  lines[-1] += "…"
              return lines
          def card(e, poster):
              W, H = 1200, 630
              img = Image.new("RGB", (W, H), "#fffdf7"); d = ImageDraw.Draw(img)
              x0 = 70
              if poster:
                  bg = ImageOps.fit(poster, (600, H)).filter(ImageFilter.GaussianBlur(28))
                  bg = Image.blend(bg, Image.new("RGB", bg.size, "#1f1a10"), .35)
                  img.paste(bg, (0, 0))
                  p = poster.copy(); p.thumbnail((560, 580))
                  img.paste(p, ((600 - p.width)//2, (H - p.height)//2))
                  x0 = 650
              else:
                  logo(d, 790, 150, 3.3, "#f1e4bd")
              tw = W - x0 - 60
              logo(d, x0 - 6, 52, 0.62)
              d.text((x0 + 70, 62), "my", font=F("sora", 800, 40), fill="#1f1a10")
              d.text((x0 + 70 + d.textlength("my", font=F("sora", 800, 40)), 62), "event", font=F("sora", 800, 40), fill=G)
              fT = F("sora", 700, 54 if len(e["name"]) < 30 else 44)
              y = 170
              for l in wrap(d, e["name"], fT, tw, 3):
                  d.text((x0, y), l, font=fT, fill="#1f1a10"); y += int(fT.size * 1.22)
              y += 18
              fI = F("inter", 500, 28)
              dt, hr = fdate(e["starts_at"])
              for l in wrap(d, dt, fI, tw, 1) + wrap(d, hr + (" · " + e["place"] if e.get("place") else ""), fI, tw, 2):
                  d.text((x0, y), l, font=fI, fill="#756b55"); y += 40
              fB = F("sora", 600, 26); lab = "Billets sur MyEvent"
              bw = d.textlength(lab, font=fB) + 56
              d.rounded_rectangle((x0, H - 112, x0 + bw, H - 56), radius=28, fill="#f5e6b8")
              d.text((x0 + 28, H - 101), lab, font=fB, fill="#6e520c")
              return img
          def app_card():
              """Image du lien de l'application (ID, lien général) : comme l'accueil de MyEvent."""
              W, H, S = 1200, 630, 2
              img = Image.new("RGB", (W*S, H*S), "#faf8f3")
              glow = Image.new("L", img.size, 0); ImageDraw.Draw(glow).ellipse((300*S, -120*S, 900*S, 560*S), fill=150)
              glow = glow.filter(ImageFilter.GaussianBlur(110*S))
              img = Image.composite(Image.new("RGB", img.size, "#f3e3b5"), img, glow); d = ImageDraw.Draw(img)
              sc = 2.35*S; logo(d, W*S/2 - 60*sc, 70*S, sc)
              fW = F("sora", 800, 128*S); y = 330*S
              w1 = d.textlength("my", font=fW); w2 = d.textlength("event", font=fW); x = (W*S - w1 - w2)/2
              d.text((x, y), "my", font=fW, fill="#1f1a10"); d.text((x + w1, y), "event", font=fW, fill=G)
              fS = F("sora", 600, 44*S); t = "La clé de vos événements"
              d.text(((W*S - d.textlength(t, font=fS))/2, y + 185*S), t, font=fS, fill="#8f6a10")
              return img.resize((W, H), Image.LANCZOS)
          def page(e, img_url):
              nm = html.escape(e["name"]); eid = e["id"]
              desc = html.escape(" à ".join(fdate(e["starts_at"])) + (" · " + e["place"] if e.get("place") else "") + " — Billets sur MyEvent")
              return f"""<!DOCTYPE html>
          <html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>{nm} — MyEvent</title>
          <meta name="description" content="{desc}">
          <meta property="og:type" content="website"><meta property="og:site_name" content="MyEvent">
          <meta property="og:title" content="{nm}">
          <meta property="og:description" content="{desc}">
          <meta property="og:url" content="{SITE}e/{eid}/">
          <meta property="og:image" content="{img_url}"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
          <meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="{img_url}">
          <meta name="theme-color" content="#ffffff">
          <script>location.replace("../../"+(location.hash&&location.hash.length>1?location.hash:"#e-{eid}"));</script>
          </head><body style="font-family:sans-serif;text-align:center;padding:40px"><p>Ouverture de MyEvent…</p><p><a href="../../#e-{eid}">Ouvrir l'événement</a></p></body></html>
          """
          def main():
              if HAS_SORA:
                  buf = io.BytesIO(); app_card().save(buf, "PNG", optimize=True)
                  if not os.path.exists("og.png") or open("og.png", "rb").read() != buf.getvalue(): open(os.environ.get("APP_OG", "og.png"), "wb").write(buf.getvalue())
              evs = json.loads(get(f"{SUPA}/rest/v1/public_events?select=id,name,place,starts_at,poster_url", {"apikey": KEY, "Authorization": "Bearer " + KEY, "User-Agent": "MyEvent-pages"}))
              print(len(evs), "événement(s)")
              for e in evs:
                  if not re.fullmatch(r"[0-9a-fA-F-]{36}", str(e.get("id", ""))): continue
                  dirp = os.path.join(OUT, e["id"]); os.makedirs(dirp, exist_ok=True)
                  poster = None
                  if e.get("poster_url"):
                      try: poster = Image.open(io.BytesIO(get(e["poster_url"]))).convert("RGB")
                      except Exception as x: print("affiche illisible", e["id"], x)
                  buf = io.BytesIO(); card(e, poster).save(buf, "JPEG", quality=82, optimize=True)
                  jp = os.path.join(dirp, "og.jpg")
                  old = open(jp, "rb").read() if os.path.exists(jp) else b""
                  if buf.getvalue() != old: open(jp, "wb").write(buf.getvalue())
                  import hashlib; v = hashlib.md5(buf.getvalue()).hexdigest()[:8]
                  h = page(e, f"{SITE}e/{e['id']}/og.jpg?v={v}")
                  hp = os.path.join(dirp, "index.html")
                  if not os.path.exists(hp) or open(hp, encoding="utf-8").read() != h: open(hp, "w", encoding="utf-8").write(h)
          main()
          PY
          python3 /tmp/build.py
      - name: Enregistrer
        run: |
          git config user.name "myevent-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og.png e 2>/dev/null || git add og.png || true
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Aperçus MyEvent mis à jour"
          git push
