name: Garder Supabase actif

on:
  schedule:
    - cron: "17 8 */3 * *"
  workflow_dispatch:

jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - name: Petite visite a Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://dgbkjdgxxcbiyqogpfpp.supabase.co/rest/v1/public_events?select=id&limit=1" \
            -H "apikey: sb_publishable_mKZS60WA_anxTpqCwr4mIg_My6NUFWj")
          echo "Reponse de Supabase : $code"
          test "$code" = "200"
